<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Revisión con fotos</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--fg:#25221e;--mu:#776f66;--line:#e6e0d6;--ac:#3f8f1f;--warn:#b5560c;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 6px}.sub{color:var(--mu);font-size:14px;line-height:1.45;margin:0 0 12px}
.login{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:360px}
input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0 10px}
button{font:inherit;cursor:pointer}.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.c.pair{grid-column:span 2}@media(max-width:420px){.c.pair{grid-column:span 2}}
.ph{display:flex;gap:2px;background:#eee}.ph figure{margin:0;flex:1;min-width:0;position:relative}
.ph img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;display:block}
.ph figcaption{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
.none{aspect-ratio:1;display:grid;place-items:center;color:var(--mu);font-size:12px;background:#fafafa}
.t{padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.n{font-weight:800;font-size:18px;color:var(--ac)}.nm{font-weight:600;line-height:1.25;word-break:break-word}
.q{color:var(--mu)}.tag{font-weight:700;color:var(--warn)}.tag.bad{color:var(--bad)}
.err{color:var(--bad);font-weight:600}
</style></head><body><div class="w">
<h1>Revisión con fotos: Leal vs Catálogo</h1>
<p class="sub">Solo lectura: aquí no se cambia nada. Mira las fotos y respóndele a Claude por número.</p>
<div id="app"><div class="login"><b>Entra con tu clave de asesor</b><input id="k" type="password" autocomplete="current-password"><button class="btn" id="go">Ver fotos</button><p class="err" id="e"></p></div></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbwGZY-vY9ELNQatTatnsdVWumyoE8nyGRQuRxBjCprunSfRgkhc__vnXUfvCmkgxkOg/exec';const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,tab='faltan';
async function go(){const b=$('#go');b.disabled=true;b.textContent='Cargando fotos…';$('#e').textContent='';
 try{const r=await fetch(API,{method:'POST',body:JSON.stringify({accion:'revision',v:'jairo',clave:$('#k').value})});const d=await r.json();
  if(!d.ok){$('#e').textContent=d.error||'Error';b.disabled=false;b.textContent='Ver fotos';return}D=d;build();render()}
 catch(e){$('#e').textContent='No hay conexión. Intenta de nuevo.';b.disabled=false;b.textContent='Ver fotos'}}
let F=[],O=[],Y=[];
function build(){const byK={};D.leal.forEach(l=>byK[l.k]=l);const usados={};
 D.cat.forEach(c=>{c.k.forEach(k=>{usados[k]=usados[k]||c.vis});(c.vis?Y:O).push(c)});
 D.leal.forEach(l=>{if(!(l.k in usados))F.push(l)});
 F.sort((a,b)=>b.q-a.q);D.byK=byK}
const img=(src,cap)=>`<figure>${src?`<img loading="lazy" src="${esc(src)}" alt="">`:'<div class="none">Sin foto</div>'}<figcaption>${cap}</figcaption></figure>`;
function render(){let h=`<div class="tabs"><button data-t="faltan" class="${tab==='faltan'?'on':''}">No están (${F.length})</button><button data-t="ocultos" class="${tab==='ocultos'?'on':''}">Ocultos (${O.length})</button><button data-t="ya" class="${tab==='ya'?'on':''}">Ya están (${Y.length})</button></div>`;
 if(tab==='faltan'){const L=F;
  h+=`<p class="sub">Productos del inventario de Leal que no están en el catálogo, de más a menos unidades en bodega.</p><div class="grid">`+
  L.map((l,i)=>`<div class="c"><div class="ph">${img(l.f,'Leal')}</div><div class="t"><span class="n">F${i+1}</span><span class="nm">${esc(l.n)}</span><span class="q">${l.q} en bodega</span></div></div>`).join('')+'</div>'}
 else{const L=tab==='ya'?Y:O,P=tab==='ya'?'C':'O';h+=`<p class="sub">${tab==='ya'?'Cada producto del catálogo con su foto de Leal al lado. Confirma que sean el mismo producto.':'Productos que están en el catálogo pero ocultos (los clientes no los ven). Si Leal no lo tiene en su inventario, sale "Sin foto".'}</p><div class="grid">`+
  L.map((c,i)=>{const ls=c.k.map(k=>D.byK[k]).filter(Boolean);const l=ls[0];
   return `<div class="c pair"><div class="ph">${img(l&&l.f,'Leal')}${img('../img/'+c.img,'Catálogo')}</div><div class="t"><span class="n">${P}${i+1}</span><span class="nm">${esc(c.n)}</span><span class="q">Leal: ${ls.length?esc(ls.map(x=>x.n).join(' + ')):'<span class="tag bad">no está en su inventario</span>'}${l?` · ${ls.map(x=>x.q).join('/')} en bodega`:''}</span>${ls.length>1?'<span class="tag">Combo</span>':''}</div></div>`}).join('')+'</div>'}
 $('#app').innerHTML=h}
document.addEventListener('click',e=>{if(e.target.id==='go')go();const t=e.target.dataset&&e.target.dataset.t;if(t){tab=t;render();scrollTo(0,0)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='k')go()});
</script></body></html>
