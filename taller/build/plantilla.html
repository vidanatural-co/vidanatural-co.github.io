<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__NOMBRE__ · Bienestar natural</title>
<meta name="description" content="Productos naturales con asesoría personal de __NOMBRE__. Pide por WhatsApp y paga al recibir.">
<meta name="theme-color" content="__COLOR__">
<meta property="og:title" content="__NOMBRE__ · Bienestar natural">
<meta property="og:description" content="Mira los productos, beneficios y precios. Pide por WhatsApp y paga al recibir.">
<meta property="og:image" content="__SITIO__/portada.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --ac:__COLOR__; --ac2:__COLOR2__; --acfg:#fff;
  --bg:#fbf7f2; --surface:#fff; --fg:#2b2430; --muted:#776d7c; --line:#ece4dc;
  --ok:#2f7a4f; --warn:#b26a12; --off:#9a9095; --wa:#1f8f4e; --gold:#f4b400;
  --display:"Baloo 2",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#1c1820;--surface:#27212c;--fg:#f4eef6;--muted:#b8adbd;--line:#3a3240;--ok:#5fbf86;--warn:#e5a04a;--off:#7d7277;--wa:#2fae64;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 10px}
header .sym{width:70px;height:70px}
.sig{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:var(--acfg);border-radius:14px;padding:9px 14px;margin:2px 0 12px}
.sig small{font-weight:700;font-size:12px;opacity:.95}
.sig b{font-family:var(--display);font-size:20px;font-weight:800;line-height:1}
.shcat.inst{border-style:solid;background:var(--ac);color:#fff}
.shcat[hidden]{display:none}
.prow[hidden]{display:none}
.shcat{display:block;width:100%;border:2px dashed var(--ac);background:var(--surface);color:var(--ac);border-radius:14px;padding:11px;font-weight:800;font-size:15px;cursor:pointer;margin:-4px 0 12px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;margin:0 -2px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.trust{font-size:13px;color:var(--muted);margin:0 0 12px;text-align:center}
.trust b{color:var(--fg)}
.rep{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1.5px solid var(--gold);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.rep .x{background:none;color:var(--muted,#888);font-size:18px;padding:4px 6px;font-weight:400}
.rep button{border:0;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:800;font-size:13px;padding:9px 14px;cursor:pointer;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.ph{position:relative;aspect-ratio:9/16;border:0;padding:0;background:#ddd;cursor:pointer;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--surface);color:var(--fg)}
.badge.low{color:var(--warn)}.badge.out{color:var(--off)}
.more{position:absolute;right:8px;bottom:8px;font-weight:800;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.info{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:700;font-size:14px;line-height:1.25}
.link{border:0;background:none;padding:0;text-align:left;color:var(--ac);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.price{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.add{margin-top:auto;border:0;border-radius:12px;padding:10px;background:var(--ac);color:var(--acfg);font-weight:800;font-size:14px;cursor:pointer}
.qty{margin-top:auto;display:flex;align-items:center;justify-content:space-between;border:2px solid var(--ac);border-radius:12px}
.qty button{border:0;background:none;color:var(--ac);font-weight:800;font-size:20px;width:42px;height:38px;cursor:pointer}
.qty span{font-weight:800;font-variant-numeric:tabular-nums}
.card.is-out .ph img{filter:grayscale(1);opacity:.55}
.add:disabled{background:var(--line);color:var(--off);cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.foot{text-align:center;margin-top:28px;font-size:13px;color:var(--muted)}
.foot button{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer}
/* barra carrito */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:30}
.bar-in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.nudge{font-size:13px;color:var(--ok);font-weight:800}
.go{border:0;border-radius:14px;background:var(--wa);color:#fff;font-weight:800;font-size:15px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;width:100%;text-decoration:none}
.go s{opacity:.75;font-weight:600;margin-right:6px}
/* capas */
.ov{position:fixed;inset:0;background:rgba(10,6,8,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.ov img{max-height:100%;max-width:100%;border-radius:10px}
.close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);color:var(--fg);font-size:20px;cursor:pointer;z-index:2}
.sheet{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:460px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet h2{font-family:var(--display);margin:0;font-size:22px}
.row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.row.disc{color:var(--ok);font-weight:800}
.row.tot{font-weight:800;font-size:17px;border-top:1px solid var(--line);padding-top:8px}
.ficha{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.ficha-in{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.top{display:grid;grid-template-columns:38% minmax(0,1fr);gap:14px;align-items:start;padding-top:44px}
.top-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero{border:0;padding:0;background:none;cursor:zoom-in;width:100%}
.hero img{width:100%;border-radius:14px;display:block}
.hero small{display:block;font-size:12px;font-weight:700;margin-top:6px;text-align:center}
.ficha h2{font-family:var(--display);font-size:22px;line-height:1.15;margin:0}
.hook{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2;margin:0;color:var(--ac)}
.sub{color:var(--muted);margin:0;line-height:1.5}
.ficha h3{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin:6px 0 0}
.ficha ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ficha li{display:flex;gap:10px;line-height:1.45}
.ficha li::before{content:"✓";color:var(--ok);font-weight:800}
.t{margin:0;line-height:1.5}
.reg{margin:0;font-size:13px;font-weight:700;color:var(--ok)}
.pay{margin:0;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.ask,.share{border:2px solid var(--wa);color:var(--wa);background:none;border-radius:14px;padding:12px;text-align:center;font-weight:800;text-decoration:none;cursor:pointer}
.share{border-color:var(--ac);color:var(--ac)}
.legal{font-size:12px;color:var(--muted);margin:0}
.combo{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.combo img{width:52px;aspect-ratio:9/16;object-fit:cover;border-radius:8px;flex:none;cursor:pointer}
.combo-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;font-size:14px}
.save{color:var(--ok);font-size:12.5px;font-weight:800}
.in{color:var(--ok);font-weight:800;font-size:13px}
.op{background:var(--surface);border-left:4px solid var(--ac);padding:10px 12px;border-radius:8px;font-style:italic;margin:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:60;font-size:14px}
/* panel */
.panel{position:fixed;inset:0;z-index:55;background:var(--bg);overflow-y:auto}
.panel-in{max-width:620px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--display);margin:40px 0 0;font-size:24px}
.panel label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.panel input{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow input{text-align:right;padding:8px 10px}
.btn{border:0;border-radius:12px;background:var(--ac);color:var(--acfg);font-weight:800;padding:12px 16px;cursor:pointer;font-size:15px}
.btn.alt{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.err{color:#c0392b;font-weight:700;margin:0}
.tabs{display:flex;gap:8px}
.ped{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-line}
@media (prefers-reduced-motion:no-preference){.add,.go{transition:transform .12s}.add:active,.go:active{transform:scale(.97)}}
</style>
</head>
<body>
<div class="wrap">
  <header><svg class="sym" viewBox="0 0 100 100" aria-hidden="true">__SIMBOLO__</svg></header>
  <div class="sig"><small>Te atiende tu __TRATO__</small><b>__NOMBRE__</b></div>
  <button class="shcat" id="shcat">📲 Compartir mi catálogo</button>
  <button class="shcat inst" id="inst" hidden>⬇️ Instalar app en mi celular</button>
  <input id="q" class="search" type="search" placeholder="Escribe lo que buscas…" aria-label="Buscar producto">
  <div class="cats" id="cats"></div>
  <p class="trust"><b>Pagas cuando lo recibes.</b> Elige tus productos y te atiendo por WhatsApp.</p>
  <div class="rep" id="rep" hidden></div>
  <div class="grid" id="grid"><p class="empty" style="grid-column:1/-1">Cargando productos…</p></div>
  <div class="foot">Productos naturales · Los suplementos no son medicamentos.<br><button id="soy">Soy asesor</button></div>
</div>

<div class="bar" id="bar" hidden><div class="bar-in"><div class="nudge" id="nudge"></div><button class="go" id="go"><span id="count"></span><span id="tot"></span></button></div></div>
<div class="ov" id="viewer" hidden><button class="close" data-close aria-label="Cerrar">✕</button><img id="vimg" alt=""></div>
<div class="ficha" id="ficha" hidden><button class="close" data-close aria-label="Cerrar">✕</button><div class="ficha-in" id="fin"></div></div>
<div class="ov" id="sum" hidden><button class="close" data-close aria-label="Cerrar">✕</button><div class="sheet" id="sumin"></div></div>
<div class="panel" id="panel" hidden><button class="close" data-close aria-label="Cerrar">✕</button><div class="panel-in" id="pin"></div></div>

<script>
const CFG={v:"__V__",nombre:"__NOMBRE__",api:"__API__",sitio:"__SITIO__"};
const $=s=>document.querySelector(s);
const cop=n=>'$'+Math.round(n).toLocaleString('es-CO');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let D=ls.get('cat_'+CFG.v,null),P=[],byId={},byName={},cart={},cat='Todos',open=null;

function setData(d){D=d;P=(d.productos||[]).slice().reverse();byId={};byName={};P.forEach(p=>{byId[p.id]=p;byName[p.n.toLowerCase()]=p});}
async function load(){
  if(D)setData(D),render();
  try{const r=await fetch(CFG.api+'?accion=catalogo&v='+CFG.v);const d=await r.json();if(d.ok){setData(d);ls.set('cat_'+CFG.v,d);render();deep();}else if(!D)fail();}
  catch(e){if(!D)fail()}
}
function fail(){$('#grid').innerHTML='<p class="empty" style="grid-column:1/-1">No pudimos cargar los productos. Revisa tu conexión y vuelve a intentar.</p>'}
function deep(){const id=new URLSearchParams(location.search).get('p');if(id&&byId[id]&&!open)showF(id)}

function cats(){const s=new Set();P.forEach(p=>p.c.forEach(c=>s.add(c)));const l=['Todos',...[...s].sort((a,b)=>a.localeCompare(b,'es'))];
 $('#cats').innerHTML=l.map(c=>`<button aria-pressed="${c===cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
function badge(s){return s==='agotado'?'<span class="badge out">Agotado</span>':s==='ultimas'?'<span class="badge low">Últimas unidades</span>':''}
function ctl(p){const k=cart[p.id]||0;return p.s==='agotado'?'<button class="add" disabled>Agotado</button>':k?`<div class="qty"><button data-m="${p.id}" aria-label="Quitar uno">–</button><span>${k}</span><button data-p="${p.id}" aria-label="Agregar uno">+</button></div>`:`<button class="add" data-p="${p.id}">Agregar</button>`}
function norm(t){return String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function grid(){if(!D)return;const q=norm($('#q').value.trim());
 const l=P.filter(p=>(cat==='Todos'||p.c.includes(cat))&&(!q||norm(p.n+' '+p.g+' '+p.d+' '+p.c.join(' ')).includes(q)));
 $('#grid').innerHTML=l.length?l.map(p=>`<article class="card${p.s==='agotado'?' is-out':''}"><button class="ph" data-f="${p.id}" aria-label="Ver detalles de ${esc(p.n)}"><img src="img/${esc(p.img)}" alt="${esc(p.n)}" loading="lazy" decoding="async">${badge(p.s)}<span class="more">ⓘ Ver más</span></button><div class="info"><div class="name">${esc(p.n)}</div><button class="link" data-f="${p.id}">Ver beneficios ›</button><div class="price">${cop(p.p)}</div>${ctl(p)}</div></article>`).join(''):'<p class="empty" style="grid-column:1/-1">No encontramos productos con esa búsqueda.</p>'}
function totals(){let u=0,sub=0;const lines=[];for(const id in cart){const p=byId[id],k=cart[id];if(!p||!k)continue;u+=k;sub+=k*p.p;lines.push([k,p])}
 const d=u>=3?(D.desc3||0):u===2?(D.desc2||0):0;return{u,sub,d,tot:sub-d,lines}}
function bar(){const t=totals();$('#bar').hidden=!t.u;if(!t.u)return;
 $('#count').textContent=`🛒 ${t.u} producto${t.u>1?'s':''} · Pedir por WhatsApp`;
 $('#tot').innerHTML=t.d?`<s>${cop(t.sub)}</s>${cop(t.tot)}`:cop(t.tot);
 const d2=D.desc2||0,d3=D.desc3||0;
 $('#nudge').textContent=t.u===1&&d2?`Agrega otro y ahorra ${cop(d2)}`:t.u===2&&d3>d2?`Agrega uno más y ahorra ${cop(d3)}`:t.d?`Ya ahorras ${cop(t.d)} 🎉`:''}
function repeat(){const o=ls.get('vendedor',false)?null:ls.get('ultimo_'+CFG.v,null),el=$('#rep');
 const ok=o&&Object.keys(o).some(id=>byId[id]);if(!ok||Object.keys(cart).length){el.hidden=true;return}
 const n=Object.entries(o).filter(([id])=>byId[id]).reduce((a,[,k])=>a+k,0);el.hidden=false;
 el.innerHTML=`<span><b>¿Se te acabó?</b> Repite tu último pedido (${n} producto${n>1?'s':''}).</span><button data-rep>Repetir</button><button class="x" data-norep aria-label="Cerrar">✕</button>`}
function combo(p){const c=p.w.map(n=>byName[n.toLowerCase()]).filter(y=>y&&y.s!=='agotado'&&y.id!==p.id).slice(0,2);if(!c.length)return'';
 return '<h3>Se combina con</h3>'+c.map(y=>`<div class="combo"><img src="img/${esc(y.img)}" alt="" data-f="${y.id}"><div class="combo-t"><b>${esc(y.n)}</b><span class="price" style="font-size:16px">${cop(y.p)}</span>${D.desc2?`<span class="save">Llévalos juntos y ahorra ${cop(D.desc2)}</span>`:''}</div>${cart[y.id]?'<span class="in">✓ Agregado</span>':`<button class="add" data-p="${y.id}" style="margin:0;flex:none;padding:10px 14px">Agregar</button>`}</div>`).join('')}
function wa(t){return 'https://wa.me/'+D.whatsapp+'?text='+encodeURIComponent(t)}
function ficha(){if(!open)return;const p=byId[open];if(!p)return;
 const b=p.b.map(t=>{const i=t.indexOf(':');return`<li><span>${i>0?`<b>${esc(t.slice(0,i))}:</b>${esc(t.slice(i+1))}`:esc(t)}</span></li>`}).join('');
 $('#fin').innerHTML=`<div class="top"><button class="hero" data-v="img/${esc(p.img)}" aria-label="Ampliar imagen"><img src="img/${esc(p.img)}" alt="${esc(p.n)}"><small>🔍 Ampliar</small></button>
 <div class="top-txt">${badge(p.s).replace('class="badge','style="position:static;align-self:flex-start" class="badge')}<h2>${esc(p.n)}</h2><span class="price">${cop(p.p)}</span>${ctl(p)}</div></div>
 ${p.g?`<p class="hook">${esc(p.g)}</p>`:''}${p.ip?`<p class="sub"><b>Ideal para:</b> ${esc(p.ip)}</p>`:''}
 ${b?`<h3>Lo que ganas</h3><ul>${b}</ul>`:''}${p.d?`<p class="sub">${esc(p.d)}</p>`:''}${combo(p)}
 ${p.pr?`<h3>Presentación</h3><p class="t">${esc(p.pr)}</p>`:''}${p.u?`<h3>Modo de uso</h3><p class="t">${esc(p.u)}</p>`:''}
 ${p.op.length?'<h3>Lo que dicen nuestros clientes</h3>'+p.op.map(o=>`<p class="op">“${esc(o)}”</p>`).join(''):''}
 ${p.r?`<p class="reg">✔ ${esc(p.r)} · Producto original con sello de seguridad</p>`:''}
 <p class="pay">🚚 Pagas cuando lo recibes · Te atiendo por WhatsApp</p>
 <button class="share" data-share="${p.id}">Compartir este producto</button>
 <a class="ask" href="${wa('Hola '+CFG.nombre+', tengo una pregunta sobre '+p.n)}" target="_blank" rel="noopener">Preguntar por este producto</a>
 <p class="legal">Este producto no es un medicamento y no reemplaza una alimentación balanceada.</p>`}
function showF(id){open=id;ficha();$('#ficha').hidden=false;$('#ficha').scrollTop=0;
 try{history.replaceState(null,'','?p='+id)}catch(e){}}
function closeF(){open=null;$('#ficha').hidden=true;try{history.replaceState(null,'',location.pathname)}catch(e){}}
function render(){if(!D)return;cats();grid();bar();ficha();repeat()}
function toast(t,ms){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms||2500)}
const COPIADO='✅ Tu enlace quedó copiado. En Facebook o Instagram, mantén presionado donde se escribe y toca Pegar.';
function precopia(t){let ok=false;
 try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,t.length);ok=document.execCommand('copy');a.remove()}catch(e){}
 if(!ok)try{navigator.clipboard.writeText(t).then(()=>ok=true,()=>{})}catch(e){}return()=>ok}
function msg(t,num){return 'Hola '+CFG.nombre+', me interesan:\n'+t.lines.map(([k,p])=>`• ${k} ${p.n} (${cop(k*p.p)})`).join('\n')+(t.d?`\nDescuento: –${cop(t.d)}`:'')+`\nTotal: ${cop(t.tot)}`+(num?`\nPedido #${num}`:'')}
function summary(){const t=totals();
 $('#sumin').innerHTML='<h2>Tu pedido</h2>'+t.lines.map(([k,p])=>`<div class="row"><span>${k} × ${esc(p.n)}</span><span>${cop(k*p.p)}</span></div>`).join('')+(t.d?`<div class="row disc"><span>Descuento por ${t.u>=3?'3 o más':'2'} unidades</span><span>–${cop(t.d)}</span></div>`:'')+`<div class="row tot"><span>Total</span><span>${cop(t.tot)}</span></div><p class="sub" style="font-size:13px">Pagas cuando lo recibes. Al enviar, se abre WhatsApp con tu pedido listo.</p><button class="go" id="send"><span>Enviar a WhatsApp</span><span>→</span></button>`;
 $('#sum').hidden=false}
async function send(btn){const t=totals();if(!t.u)return;btn.disabled=true;btn.firstElementChild.textContent='Enviando…';
 const w=window.open('','_blank');let num=null;
 try{const ac=new AbortController();setTimeout(()=>ac.abort(),8000);const r=await fetch(CFG.api,{method:'POST',signal:ac.signal,body:JSON.stringify({accion:'pedido',v:CFG.v,items:Object.entries(cart).map(([id,k])=>({id,k}))})});const d=await r.json();if(d.ok)num=d.numero}catch(e){}
 const url=wa(msg(t,num));if(!ls.get('vendedor',false))ls.set('ultimo_'+CFG.v,cart);
 if(w&&!w.closed)w.location.href=url;else location.href=url;
 cart={};$('#sum').hidden=true;render();btn.disabled=false}
function extra(p){const m=String(p.pr||'').match(/(\d+)\s*c[áa]psulas/i);const k=m?+m[1]:0;return k>100?`🎁 ¡Trae ${k} cápsulas al precio de 100! Más producto por el mismo valor.\n`:''}
async function share(id){const p=byId[id];const link=CFG.sitio+'/p/'+id+'.html';const text=`${extra(p)}${p.n} – ${cop(p.p)}. Mira los beneficios y pide aquí: ${link}`;const cp=precopia(text);
 try{if(navigator.share){let files=[];try{const b=await (await fetch('img/'+p.img)).blob();const f=new File([b],p.img,{type:b.type||'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[f]}))files=[f]}catch(e){}
  await navigator.share(files.length?{files,text}:{text,url:link});toast(cp()?COPIADO:'No pude copiar el enlace. Cópialo desde la barra de arriba.',6000);return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text);toast('Enlace copiado')}catch(e){prompt('Copia este enlace:',link)}}

async function shareCat(){const link=CFG.sitio+'/';const n=P.length?Math.floor(P.length/10)*10:60;
 const text=`🌿 Te invito a ver mi catálogo de productos naturales: más de ${n} productos para energía, defensas, descanso, belleza y más.\nElige lo que te guste y pídelo por WhatsApp. Pagas cuando lo recibes.\n👉 ${link}`;const cp=precopia(text);
 try{if(navigator.share){let files=[];try{const b=await (await fetch('historia.jpg')).blob();const f=new File([b],'catalogo.jpg',{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[f]}))files=[f]}catch(e){}
  await navigator.share(files.length?{files,text}:{text,url:link});toast(cp()?COPIADO:'No pude copiar el enlace. Cópialo desde la barra de arriba.',6000);return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text);toast('Invitación copiada')}catch(e){prompt('Copia esta invitación:',text)}}
/* ---- Panel de asesores ---- */
let clave=null,PD=null;
async function api(body){const r=await fetch(CFG.api,{method:'POST',body:JSON.stringify(Object.assign({v:CFG.v},body))});return r.json()}
function panelLogin(err){$('#pin').innerHTML=`<h2>Panel de ${esc(CFG.nombre)}</h2>
 <div class="tabs"><button class="btn" id="tLog">Entrar</button><button class="btn alt" id="tNew">Primer ingreso</button></div>
 <div id="fLog"><label>Tu clave<input id="kClave" type="password" autocomplete="current-password"></label></div>
 <div id="fNew" hidden><label>Código de primer ingreso<input id="kCod" inputmode="numeric"></label><label>Crea tu clave (mínimo 4 caracteres)<input id="kNueva" type="password" autocomplete="new-password"></label></div>
 ${err?`<p class="err">${esc(err)}</p>`:''}<button class="btn" id="kGo">Continuar</button>`;
 $('#panel').hidden=false}
async function panelGo(){const nuevo=!$('#fNew').hidden;const b=$('#kGo');b.disabled=true;b.textContent='Revisando…';
 try{if(nuevo){const k=$('#kNueva').value;const d=await api({accion:'entrar',codigo:$('#kCod').value,clave:k});if(!d.ok)return panelLogin(d.error);clave=k}
  else{clave=$('#kClave').value}
  const d=await api({accion:'panel',clave});if(!d.ok){clave=null;return panelLogin(d.error)}PD=d;ls.set('vendedor',true);ls.set('ultimo_'+CFG.v,null);repeat();panelShow()}catch(e){panelLogin('No hay conexión. Intenta de nuevo.')}}
function panelShow(){const d=PD;$('#pin').innerHTML=`<h2>Hola, ${esc(d.asesor)}</h2>
 <p class="sub">Cambia tus precios y descuentos. Si dejas un precio vacío, ese producto no aparece en tu tienda.</p>
 <label>Buscar pedido por número<input id="bPed" inputmode="numeric" placeholder="Ej: 1043"></label><div id="rPed"></div>
 <h3 style="margin:8px 0 0">Descuentos</h3>
 <div class="prow"><span>Por 2 unidades</span><input id="d2" inputmode="numeric" value="${d.desc2||''}"></div>
 <div class="prow"><span>Por 3 o más</span><input id="d3" inputmode="numeric" value="${d.desc3||''}"></div>
 <h3 style="margin:8px 0 0">Precios</h3>
 <input id="pBus" type="search" placeholder="🔍 Buscar producto…" autocomplete="off" style="width:100%;font-size:16px;padding:10px 12px;border:1px solid #ddd;border-radius:10px;margin:6px 0">
 <p class="sub" id="pNada" hidden>No encontré ese producto.</p>
 ${d.productos.map(p=>`<div class="prow" data-n="${esc(norm(p.n))}"><span>${esc(p.n)}</span><input data-fila="${p.fila}" data-orig="${p.p||''}" inputmode="numeric" value="${p.p||''}"></div>`).join('')}
 <p class="err" id="pErr"></p><button class="btn" id="pSave">Guardar cambios</button>
 <h3 style="margin:8px 0 0">Mis últimos pedidos</h3>${d.pedidos.length?d.pedidos.map(x=>`<div class="ped"><b>Pedido #${x.num}</b> · ${new Date(x.fecha).toLocaleString('es-CO')}\n${esc(x.det)}\nDescuento: ${cop(x.desc||0)} · <b>Total: ${cop(x.total)}</b></div>`).join(''):'<p class="sub">Aún no tienes pedidos.</p>'}`}
async function panelSave(b){const cambios=[...document.querySelectorAll('[data-fila]')].filter(i=>i.value.replace(/\D/g,'')!==String(i.dataset.orig)).map(i=>({fila:+i.dataset.fila,p:i.value.replace(/\D/g,'')}));
 b.disabled=true;b.textContent='Guardando…';
 try{const d=await api({accion:'guardarPrecios',clave,desc2:$('#d2').value.replace(/\D/g,'')||0,desc3:$('#d3').value.replace(/\D/g,'')||0,cambios});
  if(!d.ok){$('#pErr').textContent=d.error;b.disabled=false;b.textContent='Guardar cambios';return}
  const r=await api({accion:'panel',clave});if(r.ok){PD=r;panelShow()}toast('Cambios guardados');ls.set('cat_'+CFG.v,null);load()}
 catch(e){$('#pErr').textContent='No hay conexión. Intenta de nuevo.';b.disabled=false;b.textContent='Guardar cambios'}}

document.addEventListener('click',e=>{const b=e.target.closest('button,img[data-f],a');if(!b)return;
 if(b.id==='soy')return panelLogin();
 if(b.id==='shcat')return shareCat();
 if(b.id==='inst'){if(instP){instP.prompt();instP.userChoice.finally(()=>{instP=null;$('#inst').hidden=true})}return}
 if(b.id==='tLog'||b.id==='tNew'){const n=b.id==='tNew';$('#fNew').hidden=!n;$('#fLog').hidden=n;$('#tNew').className=n?'btn':'btn alt';$('#tLog').className=n?'btn alt':'btn';return}
 if(b.id==='kGo')return panelGo();
 if(b.id==='pSave')return panelSave(b);
 if(b.id==='go')return summary();
 if(b.id==='send')return send(b);
 const ds=b.dataset||{};
 if(ds.cat!==undefined){cat=ds.cat;render();return}
 if(ds.p){cart[ds.p]=(cart[ds.p]||0)+1;render();return}
 if(ds.m){cart[ds.m]--;if(!cart[ds.m])delete cart[ds.m];render();return}
 if(ds.f){showF(ds.f);return}
 if(ds.v){$('#vimg').src=ds.v;$('#viewer').hidden=false;return}
 if(ds.share){share(ds.share);return}
 if(ds.norep!==undefined){ls.set('ultimo_'+CFG.v,null);repeat();return}
 if(ds.rep!==undefined){const o=ls.get('ultimo_'+CFG.v,{});for(const id in o){const p=byId[id];if(p&&p.s!=='agotado')cart[id]=o[id]}render();return}
 if(ds.close!==undefined){const o=b.parentElement;if(o.id==='ficha')closeF();else o.hidden=true}});
document.addEventListener('input',e=>{if(e.target.id==='pBus'){const q=norm(e.target.value.trim());let n=0;document.querySelectorAll('.prow[data-n]').forEach(r=>{const ok=!q||r.dataset.n.includes(q);r.hidden=!ok;if(ok)n++});$('#pNada').hidden=n>0;return}
 if(e.target.id==='q')grid();
 if(e.target.id==='bPed'&&PD){const n=e.target.value.trim();const x=PD.pedidos.find(p=>String(p.num)===n);$('#rPed').innerHTML=n?(x?`<div class="ped"><b>Pedido #${x.num}</b>\n${esc(x.det)}\nDescuento: ${cop(x.desc||0)} · <b>Total: ${cop(x.total)}</b></div>`:'<p class="sub">No encontré ese pedido entre tus últimos 50.</p>'):''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#viewer').hidden)$('#viewer').hidden=true;else if(!$('#sum').hidden)$('#sum').hidden=true;else if(open)closeF()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let instP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();instP=e;$('#inst').hidden=false});
addEventListener('appinstalled',()=>{$('#inst').hidden=true;toast('✅ App instalada. Búscala con tus demás aplicaciones.',5000)});
load();
</script>
</body>
</html>
